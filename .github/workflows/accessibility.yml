name: Accessibility

# ADR-0008 keeps Playwright E2E out of the general CI run. This is the
# dedicated, narrowly-scoped exception it anticipated: only the axe-core scan
# in e2e/accessibility.spec.ts, not the full E2E suite, so it stays fast and
# doesn't reopen the flake surface ADR-0008 was written to avoid. See
# ADR-0014.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  axe:
    name: axe-core scan of /design-system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run axe-core against the showcase (light + dark)
        run: pnpm e2e e2e/accessibility.spec.ts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
