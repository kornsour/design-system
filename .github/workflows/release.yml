name: Release

# Publishes @kornorg/design-system to npm when a merge to main carries a new
# version, using npm Trusted Publishing (OIDC) — no long-lived NPM_TOKEN.
#
# The trigger is the MERGE, not a hand-cut GitHub Release: whenever main moves,
# this compares package.json's version against what is already on npm and
# publishes only if it is new. The tag and GitHub Release are then created FROM
# the publish, rather than being the thing that causes it.
#
# Why the version still lives in package.json and is bumped by hand in the PR:
# the `main` ruleset requires a pull request for every change and has no bypass
# actors, so this workflow cannot push a bump commit back to main. Deriving the
# version from commit messages instead would leave the committed package.json
# stale and make git tags the real source of truth. Keeping the bump an explicit
# line in the feature PR preserves package.json as the source of truth and keeps
# the release decision reviewable — version-guard.yml stops it being forgotten.
#
# Dependabot merges are safe: they never change the version, so the check below
# finds it already published and the job stops before building or touching npm.
#
# The GitHub Release's notes come from CHANGELOG.md's section for this version,
# not `gh release create --generate-notes` — a generated merged-PR list is mostly
# Dependabot noise and says nothing about what a consumer on `^0.x` actually gets.
# version-guard.yml requires that section to exist on any PR that bumps the version.
#
# One-time setup on npmjs.com (package → Settings → Publishing access →
# Trusted Publisher), for @kornorg/design-system:
#   Publisher:         GitHub Actions
#   Organization/user: kornsour
#   Repository:        design-system
#   Workflow filename: release.yml   (filename only, not a path)
#   Environment:       (leave blank)
#
# The publish step uses the npm CLI (not pnpm) because npm has first-class OIDC
# support; pnpm has had OIDC 404 regressions. pnpm still builds the package via
# the `prepack` script. No token is needed under OIDC. Provenance is requested
# explicitly with --provenance: despite npm's docs claiming it is automatic under
# trusted publishing, v0.3.0 published without an attestation until the flag was
# added. Requires npm >= 11.5.1.
on:
  push:
    branches: [main]
  # Manual re-run, for recovering a merge whose publish failed partway.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag + GitHub Release after publishing
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so a manual workflow_dispatch recovery run can still tag correctly

      # Decide whether this merge is a release BEFORE building or touching npm.
      # `npm view <pkg>@<version> version` exits non-zero (E404) when the version
      # does not exist — that is the publishable case.
      - name: Check whether this version is already on npm
        id: check
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is already on npm — nothing to release."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is new — releasing."
          fi

      - name: Install pnpm
        if: steps.check.outputs.published == 'false'
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        if: steps.check.outputs.published == 'false'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          # Avoid cached credentials on release builds (npm trusted-publishing guidance)
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        if: steps.check.outputs.published == 'false'
        run: npm install -g npm@latest

      - name: Install dependencies
        if: steps.check.outputs.published == 'false'
        run: pnpm install --frozen-lockfile

      # npm publish runs the `prepack` script (pnpm build) and authenticates via
      # OIDC — no NPM_TOKEN. --provenance attaches a build attestation.
      - name: Publish to npm
        if: steps.check.outputs.published == 'false'
        run: npm publish --provenance

      # version-guard.yml requires a matching "## [<version>]" section in
      # CHANGELOG.md on any PR that bumps the version, so this should always
      # find one. Extract just that section (up to the next "## [" heading) so
      # the release notes are the human-written summary, not a merged-PR list.
      - name: Extract changelog section for this version
        if: steps.check.outputs.published == 'false'
        id: changelog
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (capturing) exit
              if ($0 ~ "^## \\[" ver "\\]") { capturing = 1; next }
            }
            capturing { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section — version-guard.yml should have caught this on the PR."
            exit 1
          fi

          echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      # Only after npm accepts the package, so a failed publish never leaves a
      # tag behind claiming a release that does not exist.
      - name: Tag and create the GitHub Release
        if: steps.check.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
          NOTES_FILE: ${{ steps.changelog.outputs.path }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file "$NOTES_FILE"
